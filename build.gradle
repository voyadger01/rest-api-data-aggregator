plugins {
    id 'org.springframework.boot' version '3.5.7'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'java'
    id 'jacoco'
}

group = 'aggregator'
version = '2.0.0'

repositories { mavenCentral() }

configurations { mockitoAgent }

java {
    toolchain { languageVersion = JavaLanguageVersion.of(25) }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    implementation 'ch.qos.logback:logback-classic'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mockito:mockito-core'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    mockitoAgent('org.mockito:mockito-core') { transitive = false }
}

tasks.named('test') {
    useJUnitPlatform()
    jvmArgs += "-javaagent:${configurations.mockitoAgent.asPath}"
}

jacoco { toolVersion = '0.8.14' }
tasks.test { finalizedBy tasks.jacocoTestReport }
tasks.jacocoTestReport { dependsOn tasks.test; reports { xml.required = true; html.required = true } }
tasks.jacocoTestCoverageVerification {
    dependsOn tasks.test
    violationRules {
        rule { limit { counter = 'LINE'; value = 'COVEREDRATIO'; minimum = 0.70 } }
    }
}
tasks.check { dependsOn tasks.jacocoTestCoverageVerification }
