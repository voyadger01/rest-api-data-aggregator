server:
  port: 8080

aggregator:
  polling:
    n: 3
    t: 30
    format: json
    file: src/main/resources/results.json
    append: true
    sources:
      weather:
        - latitude: "41.3275"
          longitude: "19.8187"
          current: "temperature_2m,relative_humidity_2m,apparent_temperature,wind_speed_10m"
          timezone: auto
        - latitude: "52.5200"
          longitude: "13.4050"
          current: "temperature_2m,relative_humidity_2m,apparent_temperature,wind_speed_10m"
          timezone: auto
      users:
        - username: Bret
        - username: Antonette
      comments:
        - sortBy: likes
          order: desc
        - sortBy: id
          order: asc
